name: consistency-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Single-source-of-truth consistency gate
        run: python scripts/consistency_check.py
      - name: Negative matrix self-test (red lines R1-R3)
        run: python scripts/consistency_check.py --self-test
